<!DOCTYPE html>
<html>
<head>
<title>TRENTO CORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:white;font-family:Arial;text-align:center;padding:20px}
h1{font-size:48px;letter-spacing:4px}
.box{background:#151515;border:1px solid #333;padding:20px;border-radius:16px;margin:20px auto;max-width:650px}
button{padding:12px 24px;margin:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.start{background:#00ff88}.stop{background:#ff4444;color:white}.restart{background:#4444ff;color:white}
input,textarea{width:92%;padding:12px;border-radius:8px;border:1px solid #333;background:#000;color:white}
</style>
</head>
<body>
<h1>TRENTO CORE</h1>
<p>trento-rp-core.vercel.app | <span style="color:#00ff88">ONLINE</span></p>
<div class="box">
<h3>🤖 Bot Discord</h3>
<input placeholder="Token Bot">
<br><br>
<button class="start">SALVA TOKEN</button>
</div>
<div class="box">
<h3>⚙️ Controllo Server</h3>
<button class="start" onclick="log.innerText='AVVIATO!'">AVVIA</button>
<button class="stop" onclick="log.innerText='FERMATO!'">FERMA</button>
<button class="restart">RIAVVIA</button>
<p id="log" style="color:#888">[LOG] Pronto...</p>
</div>
<div class="box">
<h3>📁 bot.js</h3>
<textarea rows="6">console.log('Trento Core avviato!')</textarea>
<br><br>
<button class="start">SALVA FILE</button>
</div>
</body>
</html>
